<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Global delivery</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<meta name="ext-resource-dependency" content="https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json" data-resource-id="worldAtlas" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #map { width: 100%; height: 100%; }
  svg { display: block; }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#2E3033">
  <svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="60" fill="#2E3033"/><circle cx="72" cy="34" r="4" fill="#B4452F"/><path d="M72 34 L30 20 M72 34 L52 16 M72 34 L18 30 M72 34 L98 48" stroke="#E79570" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
</template>
<div id="map"></div>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const C = {
    ink: q.get('ink') || '#2E3033',
    land: q.get('land') || '#4A4D52',
    landLine: q.get('landline') || '#6E747B',
    accent: q.get('accent') || '#0B7386',
    accentSoft: q.get('accentsoft') || '#63C8DC',
    mark: q.get('mark') || '#B4452F',
    paper: q.get('paper') || '#F8F7F5',
    head: q.get('head') || 'Bricolage Grotesque'
  };
  const paint = () => {
    document.documentElement.style.background = C.ink;
    document.body.style.background = C.ink;
    const s = d3.select('svg');
    s.selectAll('path.land').attr('fill', C.land).attr('stroke', C.landLine);
    s.selectAll('path.arc').attr('stroke', C.accentSoft);
    s.selectAll('.dot').attr('fill', C.paper);
    s.selectAll('.ring').attr('stroke', C.paper);
    s.selectAll('.hub').attr('fill', C.mark);
    s.selectAll('.hub-ring').attr('stroke', C.accentSoft);
    s.selectAll('text').attr('fill', C.paper).attr('font-family', "'" + C.head + "', system-ui, sans-serif");
  };
  window.addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'palette') return;
    Object.assign(C, e.data.colors);
    paint();
  });
  paint();
  const el = document.getElementById('map');
  const W = el.clientWidth || 720, H = el.clientHeight || 400;
  const svg = d3.select(el).append('svg').attr('width', W).attr('height', H)
    .attr('viewBox', [0, 0, W, H]);

  const atlasUrl = (window.__resources && window.__resources.worldAtlas) || 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json';
  const topo = await d3.json(atlasUrl);
  const countries = topojson.feature(topo, topo.objects.countries);

  const projection = d3.geoNaturalEarth1().fitExtent([[10, 14], [W - 10, H - 14]], countries);
  const path = d3.geoPath(projection);

  svg.append('g').selectAll('path').data(countries.features).join('path')
    .attr('class', 'land').attr('d', path).attr('fill', C.land).attr('stroke', C.landLine).attr('stroke-width', 0.5);

  const hub = [80.27, 13.08]; // Chennai
  const dests = [
    { name: 'United Kingdom', c: [-1.5, 52.5] },
    { name: 'Europe', c: [9.5, 50.0] },
    { name: 'United States', c: [-89.0, 39.5] },
    { name: 'Canada', c: [-97.0, 55.0] },
    { name: 'Brazil', c: [-47.9, -15.8] },
    { name: 'Serbia', c: [20.5, 44.0] },
    { name: 'South Africa', c: [25.0, -29.0] },
    { name: 'Australia', c: [144.0, -33.5] }
  ];

  const arcs = svg.append('g');
  dests.forEach((d, i) => {
    const line = { type: 'LineString', coordinates: [hub, d.c] };
    const p = arcs.append('path').attr('class', 'arc').attr('d', path(line))
      .attr('fill', 'none').attr('stroke', C.accentSoft).attr('stroke-width', 1.4)
      .attr('stroke-linecap', 'round').attr('opacity', 0.9);
    const len = p.node().getTotalLength();
    p.attr('stroke-dasharray', len + ' ' + len).attr('stroke-dashoffset', len)
      .transition().delay(220 * i).duration(1400).ease(d3.easeCubicInOut)
      .attr('stroke-dashoffset', 0);
  });

  const pts = svg.append('g');
  dests.forEach((d, i) => {
    const [x, y] = projection(d.c);
    pts.append('circle').attr('class', 'dot').attr('cx', x).attr('cy', y).attr('r', 0)
      .attr('fill', C.paper)
      .transition().delay(220 * i + 1200).duration(400).attr('r', 3.4);
    pts.append('circle').attr('class', 'ring').attr('cx', x).attr('cy', y).attr('r', 3.4)
      .attr('fill', 'none').attr('stroke', C.paper).attr('stroke-width', 1).attr('opacity', 0)
      .transition().delay(220 * i + 1500).duration(1600).ease(d3.easeCubicOut)
      .attr('r', 14).attr('opacity', 0).attrTween('opacity', () => t => 0.5 * (1 - t));
  });

  const [hx, hy] = projection(hub);
  svg.append('circle').attr('class', 'hub').attr('cx', hx).attr('cy', hy).attr('r', 6).attr('fill', C.mark);
  svg.append('circle').attr('class', 'hub-ring').attr('cx', hx).attr('cy', hy).attr('r', 6)
    .attr('fill', 'none').attr('stroke', C.accentSoft).attr('stroke-width', 1.2).attr('opacity', 0.6)
    .attr('r', 11);
  svg.append('text').attr('x', hx + 12).attr('y', hy + 4)
    .attr('fill', C.paper).attr('font-family', "'" + C.head + "', system-ui, sans-serif")
    .attr('font-size', 12).attr('letter-spacing', '0.06em').text('CHENNAI');
})();
</script>
</body>
</html>
